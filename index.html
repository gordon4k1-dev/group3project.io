<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Local AI Search (Phi-3 Mini)</title>
  <style>
    body{font-family:Arial;padding:12px; max-width: 600px; margin: 0 auto;}
    button{margin:4px;padding:8px; cursor: pointer;}
    input[type="text"] { width: 100%; padding: 8px; margin-bottom: 8px; box-sizing: border-box;}
    #aiResult {white-space:pre-wrap;background:#f6f6f6;padding:16px;border-radius:6px; min-height: 100px; margin-top: 16px; border: 1px solid #ccc;}
  </style>
</head>
<body>
  <h2>Local AI Search (Phi-3 Mini)</h2>
  <div>
    <input type="text" id="aiPrompt" placeholder="Enter your search prompt here...">
    <button id="btnAskAI">Ask AI</button>
  </div>

  <h4>AI Response</h4>
  <div id="aiResult">Awaiting input...</div>

  <script>
    const aiResult = document.getElementById('aiResult');

    document.getElementById('btnAskAI').onclick = async () => {
      const promptInput = document.getElementById('aiPrompt').value;
      if (!promptInput.trim()) {
        aiResult.textContent = 'Please enter a prompt.';
        return;
      }

      aiResult.textContent = 'Thinking...';
      try {
        const response = await fetch(`http://localhost:8000/search?prompt=${encodeURIComponent(promptInput)}`);
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        const data = await response.json();
        aiResult.textContent = data.response || JSON.stringify(data);
      } catch (error) {
        aiResult.textContent = 'Error communicating with AI backend:\n' + error.message;
      }
    };
  </script>
</body>
</html>
